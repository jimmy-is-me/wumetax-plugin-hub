name: Build release package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress ZIP
        run: |
          mkdir -p dist/wumetax-plugin-hub
          rsync -a --exclude .git --exclude dist ./ dist/wumetax-plugin-hub/
          cd dist && zip -r ../wumetax-plugin-hub.zip wumetax-plugin-hub
      - uses: softprops/action-gh-release@v2
        with:
          files: wumetax-plugin-hub.zip
